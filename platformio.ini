; ESP32-2432S028 "Cheap Yellow Display" (CYD)
; 2.8" ILI9341 240x320 TFT + XPT2046 resistive touch, CH340 USB-serial
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 460800
upload_speed = 460800

; two OTA app slots (1.9 MB each) so web/OTA updates work
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    links2004/WebSockets @ ^2.7.3
    bblanchon/ArduinoJson @ ^7.4.3

build_flags =
    ; core log lines bypass our serial mutex and corrupt screen dumps
    -D CORE_DEBUG_LEVEL=0
    ; ---- TFT_eSPI configuration (replaces User_Setup.h) ----
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1
    -D USE_HSPI_PORT=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    ; ---- Touch (XPT2046 on its own SPI bus) ----
    -D TOUCH_CLK=25
    -D TOUCH_MOSI=32
    -D TOUCH_MISO=39
    -D TOUCH_CS=33
    -D TOUCH_IRQ=36
    ; ---- Misc board peripherals ----
    -D LED_R=4
    -D LED_G=16
    -D LED_B=17
    -D LDR_PIN=34
